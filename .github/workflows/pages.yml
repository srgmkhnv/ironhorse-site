name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript
        run: npm run check
      - name: Verify publish directory
        run: test -s dist/index.html && test -s dist/assets/wordmark.svg
      - name: Upload only the public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
